<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Compensation &amp; Incentives Hub · moved</title>
<script>
  // The dashboard moved to a new address: go there, keeping the page (#/c/opd …).
  // Until 31 Oct 2026 straight away; after that with a note to update the bookmark.
  (function () {
    var to = 'https://sgh-eg-na-incentives-hub.github.io/' + location.hash;
    var quiet = new Date() < new Date('2026-11-01T00:00:00+02:00');
    if (quiet) { location.replace(to); return; }
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('go').href = to;
      document.getElementById('note').hidden = false;
      setTimeout(function () { location.replace(to); }, 6000);
    });
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f1; color: #0b0b0b; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #fff; } .box { background: #1a1a19; } }
  .box { max-width: 460px; margin: 16px; padding: 28px; border-radius: 16px; background: #fcfcfb; box-shadow: 0 8px 30px rgba(0,0,0,.12); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 10px; background: #2a78d6; color: #fff; text-decoration: none; font-weight: 600; }
  code { font-size: 13px; }
</style>
</head>
<body>
  <div class="box" id="note" hidden>
    <h1>The dashboard has a new address</h1>
    <p>Please update your bookmark to<br /><code>https://sgh-eg-na-incentives-hub.github.io</code></p>
    <a class="btn" id="go" href="https://sgh-eg-na-incentives-hub.github.io/">Open the dashboard</a>
    <p style="font-size:12.5px;opacity:.7">Opening it for you in a few seconds…</p>
  </div>
  <noscript><p style="text-align:center">The dashboard moved to <a href="https://sgh-eg-na-incentives-hub.github.io/">https://sgh-eg-na-incentives-hub.github.io</a></p></noscript>
</body>
</html>
